      <h1>Splittiamo — Household expenses, finally clear.</h1>
      <p>Perfect for shared houses, roommates and household groups. And it works even if you live alone.</p>
      <h2>How it works</h2>
      <ul>
        <li><strong>Create your house</strong> — One minute: house name and utilities. Whoever lives with you joins with an invite code.</li>
        <li><strong>Add your bills</strong> — Amount and month, even just from a photo. The app does the rest.</li>
        <li><strong>Everyone knows their share</strong> — Clear shares for each person, month by month, even with mid-month move-ins and move-outs.</li>
        <li><strong>Settle up without arguing</strong> — Recorded settlements and a PDF summary ready to share: with your flatmates or your landlord.</li>
      </ul>
      <h2>Why Splittiamo</h2>
      <ul>
        <li><strong>Missing bills</strong> — Warns you if a month is left uncovered.</li>
        <li><strong>Billing periods</strong> — A June bill covering March and April is paid by whoever was there then.</li>
        <li><strong>Empty rooms</strong> — On property costs the empty share stays with the landlord, not the others.</li>
        <li><strong>Data in Europe</strong> — EU servers, no profiling.</li>
      </ul>
      <h2>Frequently asked questions</h2>
      <ul>
        <li><strong>How much does it cost?</strong> Nothing: today it's free and has no ads. Below I explain how I keep it running.</li>
        <li><strong>Do I need to be good with numbers?</strong> No: enter the bill's amount and month, the app handles the splitting.</li>
        <li><strong>Is my data safe?</strong> Yes: servers in Europe, no profiling, and you can export or delete everything whenever you want.</li>
      </ul>
