      <h1>Splittiamo — Die Ausgaben des Haushalts, endlich klar.</h1>
      <p>Perfekt für WGs, Mitbewohner und Haushaltsgruppen. Und funktioniert auch, wenn du allein wohnst.</p>
      <h2>So funktioniert's</h2>
      <ul>
        <li><strong>Erstelle dein Zuhause</strong> — Eine Minute: Name des Zuhauses und Verträge. Wer mit dir wohnt, tritt mit einem Einladungscode bei.</li>
        <li><strong>Lade die Rechnungen hoch</strong> — Betrag und Monat, sogar nur per Foto. Den Rest erledigt die App.</li>
        <li><strong>Jeder kennt seinen Anteil</strong> — Klare Anteile für alle, Monat für Monat, auch bei Ein- und Auszügen mitten im Monat.</li>
        <li><strong>Rechne ab, ohne zu streiten</strong> — Erfasste Ausgleichszahlungen und eine PDF-Übersicht zum Teilen: mit den Mitbewohnern oder dem Vermieter.</li>
      </ul>
      <h2>Warum Splittiamo</h2>
      <ul>
        <li><strong>Fehlende Rechnungen</strong> — Warnt dich, wenn ein Monat offen bleibt.</li>
        <li><strong>Verbrauchsmonate</strong> — Eine Juni-Rechnung für März und April zahlen die, die damals da waren.</li>
        <li><strong>Leere Zimmer</strong> — Bei Immobilienkosten bleibt der leere Anteil beim Vermieter, nicht bei den anderen.</li>
        <li><strong>Daten in Europa</strong> — EU-Server, kein Profiling.</li>
      </ul>
      <h2>Häufige Fragen</h2>
      <ul>
        <li><strong>Was kostet das?</strong> Nichts: heute ist sie kostenlos und werbefrei. Unten erkläre ich, wie ich sie am Laufen halte.</li>
        <li><strong>Muss ich gut rechnen können?</strong> Nein: Betrag und Monat der Rechnung eingeben, die App übernimmt die Aufteilung.</li>
        <li><strong>Sind meine Daten sicher?</strong> Ja: Server in Europa, kein Profiling, und du kannst alles jederzeit exportieren oder löschen.</li>
      </ul>
