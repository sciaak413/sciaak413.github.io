      <h1>Splittiamo — Les dépenses du foyer, enfin claires.</h1>
      <p>Parfaite pour les colocations, les colocataires et les groupes domestiques. Et elle fonctionne aussi si tu vis seul.</p>
      <h2>Comment ça marche</h2>
      <ul>
        <li><strong>Crée ton logement</strong> — Une minute : nom du logement et compteurs. Ceux qui vivent avec toi rejoignent avec un code d'invitation.</li>
        <li><strong>Ajoute les factures</strong> — Montant et mois, même à partir d'une simple photo. L'appli fait le reste.</li>
        <li><strong>Chacun sait ce qu'il doit</strong> — Parts claires pour chacun, mois par mois, même avec des arrivées et départs en cours de mois.</li>
        <li><strong>Règle tes comptes sans dispute</strong> — Régularisations enregistrées et récapitulatif PDF prêt à partager : avec tes colocs ou avec le propriétaire.</li>
      </ul>
      <h2>Pourquoi Splittiamo</h2>
      <ul>
        <li><strong>Factures manquantes</strong> — Te prévient si un mois reste découvert.</li>
        <li><strong>Mois concernés</strong> — La facture de juin qui couvre mars et avril est payée par ceux qui étaient là.</li>
        <li><strong>Chambres vides</strong> — Sur les charges du logement, la part vide reste au propriétaire, pas aux autres.</li>
        <li><strong>Données en Europe</strong> — Serveurs dans l'UE, aucun profilage.</li>
      </ul>
      <h2>Questions fréquentes</h2>
      <ul>
        <li><strong>Combien ça coûte ?</strong> Rien : aujourd'hui c'est gratuit et sans publicité. Plus bas, je t'explique comment je la maintiens.</li>
        <li><strong>Faut-il être doué en calcul ?</strong> Non : saisis le montant et le mois de la facture, l'appli s'occupe du partage.</li>
        <li><strong>Mes données sont-elles en sécurité ?</strong> Oui : serveurs en Europe, aucun profilage, et tu peux tout exporter ou supprimer quand tu veux.</li>
      </ul>
