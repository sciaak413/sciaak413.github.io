      <h1>Splittiamo — Los gastos del hogar, por fin claros.</h1>
      <p>Perfecta para pisos compartidos, compañeros y grupos domésticos. Y también funciona si vives solo.</p>
      <h2>Cómo funciona</h2>
      <ul>
        <li><strong>Crea tu casa</strong> — Un minuto: nombre de la casa y suministros. Quien vive contigo entra con un código de invitación.</li>
        <li><strong>Añade las facturas</strong> — Importe y mes, incluso solo con una foto. Del resto se encarga la app.</li>
        <li><strong>Cada uno sabe cuánto debe</strong> — Cuotas claras para cada uno, mes a mes, incluso con entradas y salidas a mitad de mes.</li>
        <li><strong>Salda cuentas sin discutir</strong> — Ajustes registrados y resumen en PDF listo para compartir: con tus compañeros o con el propietario.</li>
      </ul>
      <h2>Por qué Splittiamo</h2>
      <ul>
        <li><strong>Facturas que faltan</strong> — Te avisa si un mes queda sin cubrir.</li>
        <li><strong>Meses de consumo</strong> — La factura de junio que cubre marzo y abril la paga quien estaba entonces.</li>
        <li><strong>Habitaciones vacías</strong> — En los gastos del inmueble la parte vacía queda para el propietario, no para los demás.</li>
        <li><strong>Datos en Europa</strong> — Servidores en la UE, sin perfilado.</li>
      </ul>
      <h2>Preguntas frecuentes</h2>
      <ul>
        <li><strong>¿Cuánto cuesta?</strong> Nada: hoy es gratuita y no tiene publicidad. Más abajo te explico cómo la mantengo.</li>
        <li><strong>¿Hay que saber hacer cuentas?</strong> No: introduce el importe y el mes de la factura, la app se encarga del reparto.</li>
        <li><strong>¿Mis datos están seguros?</strong> Sí: servidores en Europa, sin perfilado, y puedes exportar o borrar todo cuando quieras.</li>
      </ul>
