      <h1>Splittiamo — As despesas da casa, finalmente claras.</h1>
      <p>Perfeita para casas partilhadas, colegas de casa e grupos domésticos. E funciona mesmo se vives sozinho.</p>
      <h2>Como funciona</h2>
      <ul>
        <li><strong>Cria a tua casa</strong> — Um minuto: nome da casa e serviços. Quem vive contigo entra com um código de convite.</li>
        <li><strong>Adiciona as contas</strong> — Valor e mês, até só com uma foto. Do resto trata a app.</li>
        <li><strong>Cada um sabe quanto deve</strong> — Quotas claras para cada um, mês a mês, mesmo com entradas e saídas a meio do mês.</li>
        <li><strong>Acerta contas sem discutir</strong> — Acertos registados e resumo em PDF pronto a partilhar: com os colegas ou com o senhorio.</li>
      </ul>
      <h2>Porquê o Splittiamo</h2>
      <ul>
        <li><strong>Contas em falta</strong> — Avisa-te se um mês fica por cobrir.</li>
        <li><strong>Meses abrangidos</strong> — A conta de junho que cobre março e abril paga-a quem lá estava.</li>
        <li><strong>Quartos vazios</strong> — Nas despesas do imóvel a parte vazia fica com o senhorio, não com os outros.</li>
        <li><strong>Dados na Europa</strong> — Servidores na UE, sem perfilagem.</li>
      </ul>
      <h2>Perguntas frequentes</h2>
      <ul>
        <li><strong>Quanto custa?</strong> Nada: hoje é gratuita e não tem publicidade. Mais abaixo explico como a mantenho.</li>
        <li><strong>É preciso saber fazer contas?</strong> Não: insere o valor e o mês da conta, a app trata da divisão.</li>
        <li><strong>Os meus dados estão seguros?</strong> Sim: servidores na Europa, sem perfis, e podes exportar ou apagar tudo quando quiseres.</li>
      </ul>
